<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MedChain</title>

  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:sans-serif;background:#f5f7fa;color:#1a1a2e;min-height:100vh}

    header{
      background:#1a1a2e;color:white;
      padding:1rem 1.5rem;
      display:flex;justify-content:space-between;align-items:center;
    }

    #wallet-btn{
      background:#00b4d8;color:white;
      border:none;padding:8px 16px;border-radius:8px;
      cursor:pointer;font-weight:600;
    }

    main{max-width:700px;margin:2rem auto;padding:0 1rem}

    .card{background:white;padding:1.5rem;border-radius:12px;margin-bottom:1rem}
    input{
      width:100%;padding:10px;border:1px solid #ddd;
      border-radius:8px;margin-top:5px
    }

    button.primary{
      width:100%;margin-top:10px;
      padding:10px;border:none;border-radius:8px;
      background:#1a1a2e;color:white;font-weight:600;
      cursor:pointer;
    }

    .tab{cursor:pointer;padding:8px 12px;border:1px solid #ddd;border-radius:8px}
    .tab.active{background:#1a1a2e;color:white}

    .panel{display:none}
    .panel.active{display:block}

    .msg{margin-top:10px;font-size:13px}
  </style>
</head>

<body>

<header>
  <div>
    <h1>💊 MedChain</h1>
    <small>Stellar Soroban dApp</small>
  </div>

  <div>
    <button id="wallet-btn" onclick="connectWallet()">Connect Freighter</button>
    <div id="wallet-address">Not connected</div>
  </div>
</header>

<main>

  <div class="card">
    <h3>Register Batch</h3>
    <input id="batchId" placeholder="Batch ID"/>
    <input id="name" placeholder="Medicine Name"/>
    <input id="mfr" placeholder="Manufacturer"/>
    <input id="exp" type="date"/>
    <button class="primary" onclick="registerBatch()">Register</button>
    <div id="register-msg"></div>
  </div>

  <div class="card">
    <h3>Verify Batch</h3>
    <input id="verifyId" placeholder="Batch ID"/>
    <button class="primary" onclick="verifyBatch()">Verify</button>
    <div id="verify-msg"></div>
  </div>

</main>

<script type="module">
import * as StellarSdk from "https://esm.sh/@stellar/stellar-sdk@13.0.0";
import freighter from "https://esm.sh/@stellar/freighter-api@2.0.0";

const CONTRACT_ID = "CDPLCHQWKFAKQGQNWRNXIPEXONA6EBMJSWS3TRILXHZ6IS5BNLO2M5HJ";
const rpc = new StellarSdk.SorobanRpc.Server("https://soroban-testnet.stellar.org");
const contract = new StellarSdk.Contract(CONTRACT_ID);

window.userAddress = null;

/* ---------------- WALLET ---------------- */
window.connectWallet = async function () {
  try {
    await freighter.setAllowed();
    const { address } = await freighter.getAddress();

    window.userAddress = address;

    document.getElementById("wallet-address").innerText =
      address.slice(0,6) + "..." + address.slice(-4);

    document.getElementById("wallet-btn").innerText = "Connected";
  } catch (e) {
    alert(e.message);
  }
};

/* ---------------- HELPERS ---------------- */
function show(id, msg) {
  document.getElementById(id).innerHTML = msg;
}

async function sendTx(method, args) {
  const account = await rpc.getAccount(window.userAddress);

  const tx = new StellarSdk.TransactionBuilder(account, {
    fee: "100000",
    networkPassphrase: StellarSdk.Networks.TESTNET,
  })
  .addOperation(contract.call(method, ...args))
  .setTimeout(30)
  .build();

  const prepared = await rpc.prepareTransaction(tx);

  const signed = await freighter.signTransaction(
    prepared.toXDR(),
    { networkPassphrase: StellarSdk.Networks.TESTNET }
  );

  const txObj = StellarSdk.TransactionBuilder.fromXDR(
    signed.signedTxXdr,
    StellarSdk.Networks.TESTNET
  );

  return await rpc.sendTransaction(txObj);
}

/* ---------------- REGISTER ---------------- */
window.registerBatch = async function () {
  if (!window.userAddress) return alert("Connect wallet first");

  const batchId = batchId.value;
  const name = document.getElementById("name").value;
  const mfr = document.getElementById("mfr").value;
  const exp = document.getElementById("exp").value;

  try {
    const res = await sendTx("register_batch", [
      new StellarSdk.Address(window.userAddress).toScVal(),
      StellarSdk.nativeToScVal(batchId),
      StellarSdk.nativeToScVal(name),
      StellarSdk.nativeToScVal(mfr),
      StellarSdk.nativeToScVal(exp),
    ]);

    show("register-msg", "✅ Registered! TX: " + res.hash);
  } catch (e) {
    show("register-msg", "❌ " + e.message);
  }
};

/* ---------------- VERIFY ---------------- */
window.verifyBatch = async function () {
  if (!window.userAddress) return alert("Connect wallet first");

  const id = document.getElementById("verifyId").value;

  try {
    const account = await rpc.getAccount(window.userAddress);

    const tx = new StellarSdk.TransactionBuilder(account, {
      fee: "100",
      networkPassphrase: StellarSdk.Networks.TESTNET,
    })
    .addOperation(contract.call("verify_batch",
      StellarSdk.nativeToScVal(id)
    ))
    .setTimeout(30)
    .build();

    const sim = await rpc.simulateTransaction(tx);

    const result = StellarSdk.scValToNative(sim.result.retval);

    show("verify-msg", JSON.stringify(result));
  } catch (e) {
    show("verify-msg", "❌ " + e.message);
  }
};
</script>

</body>
</html>
